# Minecraft 26.2 "Chaos Cubed" - the versions this line builds against.
# Selected with -Pmc=26.2 (the default in gradle.properties). KEEP EVERY VALUE
# ASCII: Gradle-style properties are read as ISO-8859-1.
#
# neoforge_version is also the floor the mod declares in neoforge.mods.toml, so
# raising it raises the requirement players see. The 26.2 pins stay where 0.1.x
# shipped them (owner's decision, SCREEN-016).
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
neo_form_version=26.2-1
fabric_version=0.153.0+26.2
fabric_loader_version=0.19.3
neoforge_version=26.2.0.67
