# =============================================================================
# Ala Screen - single source of truth for versions and mod metadata.
#
# processResources (build-logic/src/main/groovy/multiloader-common.gradle)
# expands these into fabric.mod.json, so anything the metadata needs lives here
# rather than in the version catalog.
#
# KEEP EVERY VALUE ASCII. Gradle reads this file as ISO-8859-1, so a UTF-8
# character arrives in the jar double-encoded. An em dash in a description
# shipped as mojibake twice already in this workspace (Ala Logger, then
# AlaIndustrial). Escapes (\uXXXX) work but are easy to mangle; plain ASCII
# cannot be.
# =============================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Must stay off: the configuration cache breaks the IntelliJ + Loom combination
# (FabricMC/fabric-loom#1349). The BUILD cache below is a different thing and is
# safe to keep on.
org.gradle.configuration-cache=false
org.gradle.caching=true

version=0.1.2
group=day.alacraft.alascreen
java_version=25

mod_id=alascreen
mod_name=Ala Screen
mod_author=AlaCraft
license=MIT
description=Share a Minecraft screenshot with one key. You see the shot before it leaves your machine, then it is uploaded to alacraft.day and you get a short link in chat - ready to paste into Discord, where it unfurls as the picture itself.

# Minecraft 26.2 "Chaos Cubed". Java 25 is mandatory from 26.1 onwards.
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
# Compilation-only Minecraft classpath for the loader-neutral module, in Mojang
# mappings. Yarn does not exist for the 26.x schema, so mojmap is the only option.
neo_form_version=26.2-1

fabric_version=0.153.0+26.2
fabric_loader_version=0.19.3

# NeoForge. Declared now because the module lands next; the version is the floor
# the mod declares in neoforge.mods.toml, so raising it raises the requirement
# players see - keep the Requirements section of the store page in step with it.
neoforge_version=26.2.0.67
# The FML loader spec version, not the NeoForge version. Separate on purpose:
# the loader format changes far less often than the platform.
neoforge_loader_version_range=[4,)

junit_version=5.10.2
