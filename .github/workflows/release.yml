# Installed into the PUBLIC repository at .github/workflows/release.yml
#
# Publishing is driven by a tag, so the artifact and the version can never
# disagree: whatever gradle.properties says has to match the tag, and the job
# refuses to run if it does not.
#
# The release notes are the tag's own message. This repository ships no
# CHANGELOG.md on purpose - the public history is the notes on each platform's
# page, not a file with an open [Unreleased] section that would leak unfinished
# entries. Cut the tag with the helper in the private repository, which passes
# --cleanup=verbatim; git otherwise deletes every line starting with '#' from a
# tag message, which is exactly what a Markdown heading looks like.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from
    # 2026-10-19 (actions/runner-images#14748), and a release that breaks
    # half-way leaves some platforms published and others not. This job needs
    # jq, unzip, curl and python3 from the image (JDK 25 comes from setup-java).
    # Move to ubuntu-26.04 after a dry_run of this workflow has passed on it.
    runs-on: ubuntu-24.04

    # Declared at job level, not on the step: a step's own `env` is not visible
    # to that step's `if`, so the publish steps would have skipped silently
    # forever - a release that looks green and ships nothing.
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
      CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
      # Set either to 'true' as a repository variable to publish without that
      # platform on purpose. Absent a variable, a missing token is an error
      # rather than a skip - see "Check the publishing configuration" below.
      SKIP_MODRINTH: ${{ vars.SKIP_MODRINTH }}
      SKIP_CURSEFORGE: ${{ vars.SKIP_CURSEFORGE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every tag. This alone does NOT bring the release
          # notes: checkout afterwards re-points the tag being built at its bare
          # commit, so the notes step fetches the tag object again by itself.
          fetch-depth: 0
          fetch-tags: true

      # A missing token used to mean "skip that platform quietly", which turns
      # the worst outcome - a release nobody can download - into a green check
      # mark. Decide it here, once, and fail loudly unless the omission was
      # declared deliberately.
      - name: Check the publishing configuration
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          fail=0
          if [ "$SKIP_MODRINTH" != "true" ]; then
            [ -n "$MODRINTH_TOKEN" ]   || { echo "::error::MODRINTH_TOKEN is not set. Add it, or set the repository variable SKIP_MODRINTH=true to publish without Modrinth on purpose."; fail=1; }
            [ -n "$MODRINTH_PROJECT" ] || { echo "::error::the repository variable MODRINTH_PROJECT_ID is not set"; fail=1; }
          else
            echo "::warning::SKIP_MODRINTH=true - this release will not reach Modrinth"
          fi
          if [ "$SKIP_CURSEFORGE" != "true" ]; then
            [ -n "$CURSEFORGE_TOKEN" ]   || { echo "::error::CURSEFORGE_TOKEN is not set. Add it, or set the repository variable SKIP_CURSEFORGE=true to publish without CurseForge on purpose."; fail=1; }
            [ -n "$CURSEFORGE_PROJECT" ] || { echo "::error::the repository variable CURSEFORGE_PROJECT_ID is not set"; fail=1; }
          else
            echo "::warning::SKIP_CURSEFORGE=true - this release will not reach CurseForge"
          fi
          exit $fail

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # Every Minecraft line the mod builds for is a file in gradle/mc/. One tag
      # releases all of them: one version number, one set of notes, a jar per
      # line and loader. Adding a line is adding a file - nothing here names one.
      - name: Read the version
        id: version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          LINES=$(ls gradle/mc/*.properties | sed -E 's#.*/##; s/\.properties$//' | sort -V | tr '\n' ' ' | sed 's/ *$//')
          if [ -z "$LINES" ]; then
            echo "::error::gradle/mc/ holds no Minecraft line - nothing to build."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION for Minecraft $LINES"

      # A tag that disagrees with the file is always a mistake, and it is the
      # kind that only shows up later as a jar whose name does not match its
      # release page.
      #
      # Note the shape used from here on: values reach the scripts through the
      # environment, not through ${{ }} interpolated into the shell text.
      # Interpolation splices a value into the script before bash sees it, so
      # whatever the value contains is read as code; a variable stays data.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match version $VERSION in gradle.properties."
            exit 1
          fi

      # :common has no Minecraft on its classpath, so one run covers every line.
      # Its lints read the per-line sources of every line, not only one.
      - name: Test
        run: ./gradlew :common:test --no-daemon

      # One build per line. A jar cannot serve two lines even from identical
      # source: the key and mouse codes are inlined at compile time, and 26.3
      # renumbered them.
      - name: Build the mod
        env:
          LINES: ${{ steps.version.outputs.lines }}
        run: |
          for mc in $LINES; do
            echo "::group::Minecraft $mc"
            ./gradlew :fabric:build :neoforge:build -Pmc="$mc" --no-daemon
            echo "::endgroup::"
          done

      # The entrypoints are the only code written twice. Nothing else notices
      # when one stops calling a shared step - both jars still build and both
      # still run, the loader that lost the call just quietly does less.
      - name: Loader parity
        run: python3 tools/loader_parity_check.py

      # The jar is what people download; checking it here beats finding out from
      # a bug report that the metadata inside was wrong. The check refuses a jar
      # carrying another loader's metadata, and a jar that claims another
      # Minecraft line than the one it is published for.
      #
      # Every jar is checked against its own expectations. The result is the
      # list of release targets - line, loader, jar, release type - that every
      # publishing step below walks, so no step can publish a jar this one did
      # not look at.
      #
      # The NeoForge file of a line whose NeoForge is only a beta is published
      # as a beta; everything else as a release.
      - name: Verify the artifacts
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LINES: ${{ steps.version.outputs.lines }}
        run: |
          : > targets.tsv
          for mc in $LINES; do
            neoforge_version=$(grep '^neoforge_version=' "gradle/mc/$mc.properties" | cut -d= -f2 | tr -d '[:space:]')
            for loader in fabric neoforge; do
              bash .github/scripts/verify-artifact.sh "$VERSION" . "$loader" "$mc"
              type=release
              if [ "$loader" = neoforge ]; then
                case "$neoforge_version" in *-beta*|*-alpha*) type=beta ;; esac
              fi
              printf '%s\t%s\t%s\t%s\n' "$mc" "$loader" "$loader/build/libs/alascreen-$loader-$mc-$VERSION.jar" "$type" >> targets.tsv
            done
          done
          echo "--- release targets -----------------------------------------"
          cat targets.tsv
          {
            echo "files<<ALASCREEN_FILES"
            cut -f3 targets.tsv
            echo "ALASCREEN_FILES"
          } >> "$GITHUB_OUTPUT"

      # %(contents) is the whole message, verbatim. Do NOT rebuild it from
      # %(contents:subject) and %(contents:body): git treats the subject as the
      # first PARAGRAPH and folds its line breaks into one line, so a wrapped
      # opening paragraph arrives on three store pages reflowed into a single
      # long line.
      #
      # The tag is fetched again before it is read, and that is not redundant.
      # On a tag push actions/checkout fetches every tag and then re-points the
      # one being built at its commit (fetch --no-tags ... +<sha>:refs/tags/<tag>),
      # so locally it becomes a lightweight tag - and %(contents) of a
      # lightweight tag is the COMMIT message. Every release before this check
      # went out that way: the commit message ("Release vX.Y.Z") became the
      # notes on GitHub and on CurseForge (actions/checkout#290). Hence the
      # checks: the tag must be an annotated one, it must be the tag of the
      # commit this run built, and its notes must not open with that commit's
      # subject.
      - name: Take the release notes from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"

          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag, so it carries no release notes. Cut the release with an annotated tag:"
            echo "  git tag -a $TAG --cleanup=verbatim -F notes.md"
            exit 1
          fi

          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points at another commit than the one this run built ($GITHUB_SHA). The tag was moved after the push; release from the tag as it is now."
            exit 1
          fi

          git tag -l --format='%(contents)' "$TAG" > NOTES.md

          if [ ! -s NOTES.md ] || [ -z "$(tr -d '[:space:]' < NOTES.md)" ]; then
            echo "::error::Tag $TAG carries no message. Cut the release with an annotated tag:"
            echo "  git tag -a $TAG --cleanup=verbatim -F notes.md"
            exit 1
          fi

          SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")"
          FIRST="$(grep -m1 -v '^[[:space:]]*$' NOTES.md || true)"
          if [ "$FIRST" = "$SUBJECT" ]; then
            echo "::error::The notes of $TAG open with the subject of its commit ('$SUBJECT'). That is the commit message, not release notes."
            exit 1
          fi

          echo "--- release notes -------------------------------------------"
          cat NOTES.md
          echo "-------------------------------------------------------------"

      # CurseForge identifies game versions, loaders and environments by numeric
      # id, and rejects an upload that names none of them.
      #
      # Resolved BEFORE the GitHub Release, on purpose. Until 0.1.4 this ran after
      # it, so a wrong id failed the run with the GitHub Release already public
      # and CurseForge empty - half a release.
      #
      # Minecraft by exact name, outside the obsolete legacy group (type 1):
      # "26.2" also exists there, and picking that entry was error 1009. Exactly
      # one match or the release stops; this is the rule Ala Industrial releases
      # both of its lines with. 26.2 must still come out as 16498, the id every
      # release before the second line used - a resolver that disagrees with a
      # known answer is not trusted with an unknown one.
      #
      # No Server tag, deliberately. This mod declares itself client-only in both
      # fabric.mod.json and neoforge.mods.toml - it hooks the player's own
      # screenshot key and uploads from their machine, and does nothing at all on
      # a server. Tagging it Server would put it in front of server admins
      # filtering for exactly that, who would install it and get nothing.
      - name: Resolve the CurseForge version ids
        id: cf_ids
        if: startsWith(github.ref, 'refs/tags/') && env.SKIP_CURSEFORGE != 'true'
        env:
          LINES: ${{ steps.version.outputs.lines }}
        run: |
          FABRIC_ID=7499   # Fabric
          CLIENT_ID=9638   # Environment: Client

          curl -sSf --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "https://minecraft.curseforge.com/api/game/versions?token=$CURSEFORGE_TOKEN" \
            -o cf_versions.json

          check() {
            local id="$1" expected="$2" actual
            actual=$(jq -r --argjson id "$id" '.[] | select(.id == $id) | .name' cf_versions.json | head -1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::CurseForge id $id is '$actual', expected '$expected'. List them with: curl -s \"https://minecraft.curseforge.com/api/game/versions?token=\$TOKEN\" | jq '.[] | {id, name, gameVersionTypeID}'"
              return 1
            fi
            echo "  id $id = $actual"
          }

          fail=0
          check "$FABRIC_ID" "Fabric" || fail=1
          check "$CLIENT_ID" "Client" || fail=1

          # NeoForge by name rather than a pinned id: unlike Fabric, its entry
          # has been renumbered before, and a stale literal here would upload
          # the NeoForge jar tagged as something else.
          NEOFORGE_ID=$(jq -r '[.[] | select(.name == "NeoForge") | .id] | if length == 1 then .[0] else empty end' cf_versions.json)
          if ! [[ "$NEOFORGE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::CurseForge has no single game version named 'NeoForge'."
            fail=1
          else
            echo "  id $NEOFORGE_ID = NeoForge (resolved by name)"
          fi

          : > cf_ids.tsv
          for mc in $LINES; do
            MC_ID=$(jq -r --arg mc "$mc" '[.[] | select(.name == $mc and .gameVersionTypeID != 1) | .id] | if length == 1 then .[0] else empty end' cf_versions.json)
            if ! [[ "$MC_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::CurseForge has no single Minecraft version named '$mc' outside the legacy group."
              fail=1
              continue
            fi
            if [ "$mc" = "26.2" ] && [ "$MC_ID" != "16498" ]; then
              echo "::error::Minecraft 26.2 resolved to $MC_ID, not 16498 as on every release so far - the resolver is not picking what it should."
              fail=1
              continue
            fi
            echo "  id $MC_ID = Minecraft $mc"
            printf '%s\t%s\n' "$mc" "$MC_ID" >> cf_ids.tsv
          done

          [ "$fail" -eq 0 ] || exit 1

          echo "fabric_id=$FABRIC_ID" >> "$GITHUB_OUTPUT"
          echo "neoforge_id=$NEOFORGE_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

      # Re-running a tag must not upload a second copy of a file CurseForge
      # already has: the upload API can neither list files nor remove them, so a
      # duplicate stays on the files page. Ask the public cfwidget index first;
      # the publish step skips every jar it already lists, by exact file name
      # (the name carries the loader and the Minecraft line, so the files of one
      # line never stand in for another's).
      #
      # The index lags minutes to hours behind an upload, so this narrows the
      # window rather than closing it: after a run whose CurseForge step
      # succeeded, do not re-run the tag until the files show up there. An index
      # that does not answer, or answers about another project, stops the
      # release instead of letting it upload blind.
      - name: Which CurseForge files already exist
        if: startsWith(github.ref, 'refs/tags/') && env.SKIP_CURSEFORGE != 'true'
        run: |
          # To a file, never into a variable: the index lists every file the
          # project ever published, and past 128 KiB a single argument kills the
          # step with "Argument list too long".
          curl -sSf --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "https://api.cfwidget.com/minecraft/mc-mods/$CURSEFORGE_PROJECT" \
            -H "User-Agent: AlaMine-Team-Org/AlaScreen-release/1.0" \
            -o cfwidget.json

          if ! jq -e --arg id "$CURSEFORGE_PROJECT" \
              '(.id | tostring) == $id and (.files | type) == "array"' cfwidget.json > /dev/null; then
            echo "::error::cfwidget did not return the file list of CurseForge project $CURSEFORGE_PROJECT. Refusing to upload without knowing what is already there; re-run once it answers."
            head -c 500 cfwidget.json; echo
            exit 1
          fi

          while IFS=$'\t' read -r mc loader jar type; do
            name="$(basename "$jar")"
            echo "CurseForge $name already published: $(jq -r --arg n "$name" 'any(.files[]; .name == $n)' cfwidget.json)"
          done < targets.tsv

      # One release for every line and loader: the notes are the same, and a
      # player picks the jar for their game from its name. Not marked as a
      # prerelease even when a NeoForge file is a beta - that would take the
      # release off "latest" for the lines whose files are stable.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.artifact.outputs.files }}
          body_path: NOTES.md
          name: Ala Screen ${{ steps.version.outputs.version }}

      # One Modrinth version per loader and line, not one version carrying
      # several files. Modrinth attaches dependencies and game versions to a
      # VERSION, not to a file: the Fabric build requires Fabric API while the
      # NeoForge build does not, and each jar supports exactly one line. Hence
      # the version number X.Y.Z+<loader>-<line>. Modrinth does not enforce
      # unique version numbers, so the existence check below is the only thing
      # keeping a re-run from publishing a duplicate - and it must name the
      # line, or the first line's file would pass for the second's.
      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true && env.SKIP_MODRINTH != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -sSf --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT/version" \
            -H "User-Agent: AlaMine-Team-Org/AlaScreen-release/1.0" \
            -o modrinth_versions.json

          fail=0
          exec 3< targets.tsv
          while IFS=$'\t' read -r -u 3 mc loader jar type; do
            number="$VERSION+$loader-$mc"
            if jq -e --arg v "$number" 'any(.[]; .version_number == $v)' modrinth_versions.json > /dev/null; then
              echo "Modrinth $number is already published - skipped"
              continue
            fi
            MC="$mc" JAR="$jar" VERSION_TYPE="$type" \
              bash .github/scripts/publish-modrinth.sh "$loader" || { echo "::error::Modrinth $number did not upload"; fail=1; }
          done
          exit $fail

      # Every target in one step, and every one attempted even after another
      # failed: the log names each upload's result, and a re-run skips what
      # already went up.
      - name: Publish to CurseForge
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true && env.SKIP_CURSEFORGE != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FABRIC_ID: ${{ steps.cf_ids.outputs.fabric_id }}
          NEOFORGE_ID: ${{ steps.cf_ids.outputs.neoforge_id }}
          CLIENT_ID: ${{ steps.cf_ids.outputs.client_id }}
        run: |
          fail=0
          exec 3< targets.tsv
          while IFS=$'\t' read -r -u 3 mc loader jar type; do
            name="$(basename "$jar")"
            if jq -e --arg n "$name" 'any(.files[]; .name == $n)' cfwidget.json > /dev/null; then
              echo "CurseForge $name is already published - skipped"
              continue
            fi
            mc_id=$(awk -F'\t' -v m="$mc" '$1 == m {print $2}' cf_ids.tsv)
            if [ "$loader" = fabric ]; then
              loader_id="$FABRIC_ID"; label="Fabric $mc"
            else
              loader_id="$NEOFORGE_ID"; label="NeoForge $mc"
            fi
            JAR="$jar" LABEL="$label" RELEASE_TYPE="$type" \
              GAME_VERSIONS="[$mc_id, $loader_id, $CLIENT_ID]" \
              bash .github/scripts/publish-curseforge.sh || { echo "::error::CurseForge $name did not upload"; fail=1; }
          done
          exit $fail
