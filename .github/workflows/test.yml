# Installed into the PUBLIC repository at .github/workflows/test.yml
#
# Proves the published copy builds and passes its tests on its own. That is not
# the same claim as "it builds in the private repository": the public tree is an
# allowlisted subset, and a file left out of the allowlist breaks the build here
# and nowhere else.
#
# Tags are handled by release.yml, which runs the same tests before publishing,
# so they are excluded here to avoid paying for the run twice.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned to the same image as release.yml, so a green test run vouches
    # for the machine the release is built on. Move both together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :common:test --no-daemon --stacktrace

      # Both loaders, always, in one job. The shared code is compiled separately
      # by each of them, so a change that compiles under one can fail under the
      # other - and finding that out at release time means the release is already
      # half-published.
      # Every Minecraft line in gradle/mc/, both loaders each: code that builds
      # for one line can fail for the other, and the release builds them all.
      - name: Build every line and loader
        run: |
          for mc in $(ls gradle/mc/*.properties | sed -E 's#.*/##; s/\.properties$//' | sort -V); do
            echo "::group::Minecraft $mc"
            ./gradlew :fabric:build :neoforge:build -Pmc="$mc" --no-daemon --stacktrace
            echo "::endgroup::"
          done

      - name: Verify every artifact
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          for mc in $(ls gradle/mc/*.properties | sed -E 's#.*/##; s/\.properties$//' | sort -V); do
            bash .github/scripts/verify-artifact.sh "$VERSION" . fabric "$mc"
            bash .github/scripts/verify-artifact.sh "$VERSION" . neoforge "$mc"
          done

      # The entrypoints are the only code written twice. Nothing else notices
      # when one of them stops calling a shared step: both jars still build,
      # both still run, and the loader that lost the call just quietly does
      # less. This is the check that notices.
      - name: Loader parity
        run: python3 tools/loader_parity_check.py
